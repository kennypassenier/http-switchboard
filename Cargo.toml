[package]
name = "http-switchboard"
version = "3.1.0"
edition = "2021"
rust-version = "1.97"
description = "Accepts a message in one shape and delivers it in another, where the configuration chooses the destination"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kennypassenier/http-switchboard"

[dependencies]
# The shared foundation (chassis-rs): command line, config layers, logging,
# /healthz, /metrics, shutdown, signed self-update. Pinned to a tag.
chassis = { git = "https://github.com/kennypassenier/chassis-rs", tag = "v2.0.0", version = "2.0.0", default-features = false, features = ["core", "self-update", "dashboard"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
minijinja = { version = "2.24.0", features = ["json"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"                                                 # the switchboard's own events ride the kit's subscriber (D-H1)
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
toml = "1.1.4"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
# The kit's in-process harness (1.8.0, K25): starts this service on a free
# port with a temporary state dir and fresh secrets, logs in, issues a
# sender token. `testing` implies `dashboard`, which this project now ships
# anyway (H1). Dev-only — the shipped binary is unchanged by this line.
chassis = { git = "https://github.com/kennypassenier/chassis-rs", tag = "v2.0.0", version = "2.0.0", default-features = false, features = ["testing"] }
