# HTTPSwitchboard — example configuration.
#
# This file is loaded by the test suite (tests/l2_translate.rs), so it
# cannot rot without a test going red. Secrets are references only; the
# values come from the environment the service is started in.

[kyu]
base_url = "http://10.10.10.9:8080"
token = "${KYU_TOKEN}"

# Where this service publishes its own failure events (AR12). Never under
# kyu.*, which the hub reserves for its own.
[reporting]
topic = "switchboard.events"

# The first customer. Alertmanager publishes its fixed payload straight
# onto the hub; this profile translates it into the shape the Home
# Assistant alert automation expects, and publishes that for hub-bridge
# to deliver.
#
# Note the templates are NOT wrapped in quotes: this profile delivers
# JSON, so every value is emitted as a complete JSON value, escaped by
# the engine. That is what stops a quote inside an alert summary from
# rewriting the document.
# The destination is the Home Assistant alert webhook. Replace the id
# below with your own: the real one is deployment configuration, and this
# file is public. The chain is deliberately short — this service is
# already a kyu consumer that acknowledges only after Home Assistant
# accepted the message, so a second hop through the hub would add a
# component without adding a guarantee (mini-round M1, 2026-08-30).
[[profiles]]
name = "alertmanager"
subscription = "switchboard"
from = { kyu_topic = "alerts.raw" }
to = { url = "http://homeassistant.lan:8123/api/webhook/REPLACE-WITH-YOUR-WEBHOOK-ID" }
content_type = "application/json"
body = '''
{"alert": {{ alerts.0.labels.alertname }},
 "status": {{ alerts.0.status }},
 "severity": {{ alerts.0.labels.severity | default("warning") }},
 "instance": {{ alerts.0.labels.instance | default("unknown") }},
 "summary": {{ alerts.0.annotations.summary }}}
'''
