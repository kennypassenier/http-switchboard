# Running the image with docker compose (T7: self-update is off inside an
# image by detection; updates are a new image). The logging block is the
# rotation for the container's stdout (H4); without it the json-file driver
# grows without bound.
services:
  http-switchboard:
    image: ghcr.io/kennypassenier/http-switchboard:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: /etc/http-switchboard/http-switchboard.env   # HTTP_SWITCHBOARD_TOKEN, HTTP_SWITCHBOARD_SECRET_KEY, HTTP_SWITCHBOARD_PUBLIC_URL
    volumes:
      - http-switchboard-state:/var/lib/http-switchboard    # a named volume inherits the image's owner
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  http-switchboard-state:
