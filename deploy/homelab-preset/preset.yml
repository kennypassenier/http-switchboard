# Preset for ~/Projects/homelab. Adding it there is a change to THAT
# project and belongs in a session opened in its directory — its feature
# list is frozen and its own gates apply. This file is the proposal.
#
# The schema is client/src/scaffold.rs::PresetMeta (description, ram_mb,
# cores, disk_gb, features, unprivileged, gpu, vpn) — see that project's
# docs/PRESET_GUIDE.md. Unknown keys are silently dropped, so an earlier
# draft of this file that carried `name:` and `env:` would have looked
# fine and quietly meant nothing.
description: "HTTPSwitchboard — reshapes a message and delivers it where the config says"
ram_mb: 256
cores: 1
disk_gb: 4
