name: CI

# Runs on every branch (standing rule 6a): branch protection waits for
# these checks, and a branch push that produced no checks could never be
# merged without a pull request.
#
# ONE job on purpose (Kenny's test policy, 2026-09-09, applied here
# 2026-09-10): "draai zoveel mogelijk lokaal … enkel wat via github
# actions moet gaat via ci". Branch protection is a GitHub feature, so
# something GitHub can see has to vouch for the commit — that is this job
# and nothing else.
#
# The omissions, named as standing rule 38 demands: cargo-deny, the
# container build and coverage used to be jobs here. They are not gone;
# they moved to the release tier of `.claude/hooks/gates.project.sh`,
# where they run locally BEFORE a tag exists instead of after the push.
# `tests/l12_gate_tiers.rs` lays the two lists side by side so this
# comment cannot quietly stop being true.
#
# This file therefore differs from the kit's scaffold on purpose and
# `chassis sync` reports it as drift.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# S7: the CI token only reads; publishing happens in release.yml.
permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Project gates (.claude/hooks/gates.project.sh, when present)
        run: if [ -x .claude/hooks/gates.project.sh ]; then .claude/hooks/gates.project.sh; else echo "no project gates"; fi
      - name: The binary answers --version without configuration (AR20)
        run: cargo run -q -- --version

