# Written by `chassis new`; read by `chassis sync` and `chassis release`.
# Added by hand for the migrated project (MIGRATION.md §10 step 1).
name = "http-switchboard"
description = "Translates message shapes between webhooks and the kyu hub"
repo = "kennypassenier/http-switchboard"
toolchain = "1.97"
chassis_tag = "v2.0.2"
chassis_repo = "https://github.com/kennypassenier/chassis-rs"
kp_themes = "5.1.0"
# Measured on CT 109 (2026-09-06, CF-6 d): the config (handed to the 1.x
# binary as a systemd credential) and the token env live in the homelab's
# config dir; the kit's state goes there too. Binary: /usr/local/bin today
# (1.x), /opt/http-switchboard/bin with the 2.x deploy (V6, homelab).
state_dir = "/appdata/kyu/http-switchboard-config"
env_file = "/appdata/kyu/http-switchboard-config/token.env"
latch = false
# Adopted by the homelab as stack http-switchboard on CT 109 (2026-08-31).
vmid = 109
